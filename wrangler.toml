name = "balvanz-cattle"
main = "src/worker.js"
compatibility_date = "2026-10-01"

# Only serve on balvanzcattle.com, so nobody can reach /clients/ through a *.workers.dev address
workers_dev = false
preview_urls = false

# Everything in /public is served as the website
[assets]
directory = "./public"
binding = "ASSETS"
not_found_handling = "404-page"

[vars]
# Contact form: sent via Resend (free) from a subdomain verified in Resend.
# Google Workspace on balvanzcattle.com (MX, SPF, DKIM) is never touched.
FROM_ADDRESS = "website@notify.balvanzcattle.com"
CONTACT_TO = "stevejr@balvanzcattle.com"

# Secret (set in the Cloudflare dashboard, NOT here): RESEND_API_KEY
# Optional secret: TURNSTILE_SECRET
